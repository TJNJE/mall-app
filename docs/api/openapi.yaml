openapi: 3.0.3
info:
  title: mall-app API 契约
  description: >
    前后端接口契约单一真源（S3）。TS 类型经 openapi-typescript 生成 src/api/schema.d.ts，
    由 src/types 解 Envelope 后 re-export。components.schemas 中 *Envelope 为统一响应
    包装 { code, message, data }，其余为 data 内容模型（与前端域模型同名）。
  version: 0.1.0
servers:
  - url: /

paths:
  /api/auth/login:
    post:
      summary: 登录
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponseEnvelope' }

  /api/products:
    get:
      summary: 商品列表（分页 + 关键字搜索）
      operationId: getProductList
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: pageSize, in: query, schema: { type: integer } }
        - { name: keyword, in: query, schema: { type: string } }
      responses:
        '200':
          description: 商品列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductListResponseEnvelope' }

  /api/products/{id}:
    get:
      summary: 商品详情
      operationId: getProductDetail
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: 商品详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductResponseEnvelope' }

  /api/orders:
    get:
      summary: 订单列表（分页）
      operationId: getOrderList
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: pageSize, in: query, schema: { type: integer } }
      responses:
        '200':
          description: 订单列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderListResponseEnvelope' }
    post:
      summary: 创建订单（下单）
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutRequest' }
      responses:
        '200':
          description: 下单结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutResponseEnvelope' }

  /api/orders/{id}:
    get:
      summary: 订单详情
      operationId: getOrderDetail
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 订单详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDetailResponseEnvelope' }

components:
  schemas:
    ApiError:
      type: object
      required: [code, message]
      properties:
        code: { type: integer }
        message: { type: string }

    LoginRequest:
      type: object
      required: [username]
      properties:
        username: { type: string }

    Product:
      type: object
      required: [id, name, price, originalPrice, image, description, category, stock, rating, reviews]
      properties:
        id: { type: integer }
        name: { type: string }
        price: { type: number }
        originalPrice: { type: number }
        image: { type: string }
        description: { type: string }
        category: { type: string }
        stock: { type: integer }
        rating: { type: number }
        reviews: { type: integer }
        tags:
          type: array
          items: { type: string }
    ProductListResponse:
      type: object
      required: [list, total, page, pageSize]
      properties:
        list:
          type: array
          items: { $ref: '#/components/schemas/Product' }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    Category:
      type: object
      required: [id, name, parentId]
      properties:
        id: { type: integer }
        name: { type: string }
        parentId:
          oneOf:
            - type: integer
            - type: 'null'

    OrderStatus:
      type: string
      enum: [pending, paid, shipped, completed, cancelled]
    OrderItem:
      type: object
      required: [productId, productName, productImage, price, quantity]
      properties:
        productId: { type: integer }
        productName: { type: string }
        productImage: { type: string }
        price: { type: number }
        quantity: { type: integer }
    ShippingAddress:
      type: object
      required: [name, phone, province, city, district, detail]
      properties:
        name: { type: string }
        phone: { type: string }
        province: { type: string }
        city: { type: string }
        district: { type: string }
        detail: { type: string }
    Order:
      type: object
      required: [id, status, items, totalAmount, address, phone, createdAt, updatedAt]
      properties:
        id: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
        totalAmount: { type: number }
        address: { $ref: '#/components/schemas/ShippingAddress' }
        phone: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
    OrderDetailResponse:
      type: object
      required: [order]
      properties:
        order: { $ref: '#/components/schemas/Order' }
    OrderListResponse:
      type: object
      required: [list, total, page, pageSize]
      properties:
        list:
          type: array
          items: { $ref: '#/components/schemas/Order' }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    CheckoutRequest:
      type: object
      required: [items, address]
      properties:
        items:
          type: array
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId: { type: integer }
              quantity: { type: integer }
        address: { $ref: '#/components/schemas/ShippingAddress' }
    CheckoutResponse:
      type: object
      required: [orderId, totalAmount]
      properties:
        orderId: { type: string }
        totalAmount: { type: number }

    # ---------- 统一响应包装 Envelope ----------
    LoginResponseEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code: { type: integer }
        message: { type: string }
        data:
          type: object
          required: [token]
          properties:
            token: { type: string }
    ProductListResponseEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code: { type: integer }
        message: { type: string }
        data: { $ref: '#/components/schemas/ProductListResponse' }
    ProductResponseEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code: { type: integer }
        message: { type: string }
        data: { $ref: '#/components/schemas/Product' }
    OrderListResponseEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code: { type: integer }
        message: { type: string }
        data: { $ref: '#/components/schemas/OrderListResponse' }
    OrderDetailResponseEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code: { type: integer }
        message: { type: string }
        data: { $ref: '#/components/schemas/OrderDetailResponse' }
    CheckoutResponseEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code: { type: integer }
        message: { type: string }
        data: { $ref: '#/components/schemas/CheckoutResponse' }
