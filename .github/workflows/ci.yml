name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# 最小权限：CI 只需读取代码（S3 review F1）
permissions:
  contents: read

# 同一分支/PR 的过期运行自动取消，避免浪费 runner（S3 review F2）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # build 脚本为 `tsc -b && vite build`，已包含类型检查，故不单独跑 typecheck
      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Dependency rules
        run: npm run cruise

      - name: Size limit
        run: npm run size

